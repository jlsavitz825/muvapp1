<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0958bc"><meta name="robots" content="noindex,nofollow"><title>MÜV Research — Interactive preview</title></head><body style="margin:0;background:#f6f8fc;color:#132b43;font:16px/1.5 system-ui"><main style="max-width:600px;padding:44px 24px;margin:auto"><h1>MÜV Research</h1><p id="status">Opening the interactive preview…</p><p>Test data stays in this browser. AI and cloud response collection are not connected.</p></main><script>(async()=>{try{const parts=await Promise.all([1,2,3,4,5].map(async n=>{const r=await fetch('./app.'+n+'.txt');if(!r.ok)throw Error('App data unavailable');return(await r.text()).trim();}));const b=atob(parts.join(''));const bytes=Uint8Array.from(b,c=>c.charCodeAt(0));const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close();}catch(e){document.getElementById('status').textContent='The preview could not load. Please refresh, or open this link in an updated Safari or Chrome.';}})();</script></body></html>
